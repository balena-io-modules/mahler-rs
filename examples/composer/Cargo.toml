[package]
name = "mahler-examples-composer"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.88"

# do not inherit the workspace from the top-level folder
[workspace]

[dependencies]
anyhow = "1.0.104"
bollard = { version = "0.21.1" }
futures-util = { version = "0.3.34", default-features = false }
mahler = { path = "../../mahler" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", default-features = false, features = [
  "rt-multi-thread",
] }
tracing-subscriber = { version = "0.3.23", features = ["registry"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", features = [
  "registry",
  "ansi",
  "env-filter",
  "fmt",
] }
